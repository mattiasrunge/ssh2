name: Test and Publish

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x # Run with latest stable Deno.

      # Install sshpass so the OpenSSH interop tests (which drive the `ssh`
      # client with password auth) run instead of being skipped. The `ssh`
      # client itself is already present on ubuntu-latest runners.
      - name: Install sshpass for OpenSSH interop tests
        run: sudo apt-get update && sudo apt-get install -y sshpass

      # Check if the code is formatted according to Deno's default
      # formatting conventions.
      - run: deno fmt --check

      # Scan the code for syntax errors and style issues. If
      # you want to use a custom linter configuration you can add a configuration file with --config <myconfig>
      - run: deno lint

      # Run all test files in the repository. Uses broad permissions because the
      # integration tests need network, filesystem, subprocess, and env access.
      - run: deno task test

      # Check if the code is publishable.
      - run: deno publish --dry-run

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # The OIDC ID token is used for authentication with JSR.
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x # Run with latest stable Deno.
      - run: deno publish
